use_default_settings: true

general:
  instance_name: "BetaMax Search"
  debug: false

search:
  safe_search: 2                      # floor only helps safesearch-capable engines; hostnames plugin below is the real fix for engines (e.g. yandex) that don't implement safesearch at all
  autocomplete: "google"
  default_lang: "en"
  # Retry across engines within a single search before giving up — improves
  # resilience when an engine transiently 403s / CAPTCHAs.
  max_page: 0
  formats:
    - html
    - json
  # Recover suspended engines FAST. Defaults suspend an engine for ~1h on 429
  # and 24h on CAPTCHA/access-denied — which, with few enabled engines, causes
  # total failure after a burst (e.g. extended_research fan-out). Shorten these
  # so a transient block doesn't take an engine offline for the whole session.
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 300      # was 86400 (24h)
    SearxEngineCaptcha: 300           # was 86400 (24h)
    SearxEngineTooManyRequests: 300   # was 3660 (~1h)
    cf_SearxEngineCaptcha: 600
    cf_SearxEngineAccessDenied: 300
    recaptcha_SearxEngineCaptcha: 600

server:
  secret_key: "OVERRIDDEN_BY_SEARXNG_SECRET_ENV"
  limiter: false
  image_proxy: true
  port: 8080
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: dark

# Engine-agnostic junk filter, applied to every result after every engine
# returns (so it still works even when an engine doesn't implement safesearch,
# e.g. yandex — see root cause #1 in the investigation doc). `remove` entries
# are the actual junk observed hitting live legal/technical queries on
# 2026-10-12; `high_priority` boosts the PH legal primary sources named in the
# task so they sort above generic noise even on a relevance tie.
hostnames:
  remove:
    - '(.*\.)?pornhub\.com$'
    - '(.*\.)?xvideos\.com$'
    - '(.*\.)?xnxx\.com$'
    - '(.*\.)?xhamster\.com$'
    - '(.*\.)?redtube\.com$'
    - '(.*\.)?youporn\.com$'
    - '(.*\.)?onlyfans\.com$'
    - '(.*\.)?chaturbate\.com$'
    - '(.*\.)?stripchat\.com$'
    - '(.*\.)?[a-z0-9-]*porn[a-z0-9-]*\..*'
    - '(.*\.)?friv\.com$'
    - '(.*\.)?[a-z0-9-]*gamesforgirls[a-z0-9-]*\..*'
    - '(.*\.)?framesynthesis\.com$'      # observed junk hit (3D driving/parking simulators), 2026-10-12
    - '(.*\.)?ra\.co$'                   # observed junk hit (Resident Advisor music site) for query "RA 4726", 2026-10-12
  low_priority:
    - '(.*\.)?pinterest\.com$'
    - '(.*\.)?tiktok\.com$'
    - '(.*\.)?youtube\.com$'
    - '(.*\.)?dictionary\.com$'
    - '(.*\.)?wiktionary\.org$'
  high_priority:
    - '(.*\.)?lawphil\.net$'
    - '(.*\.)?chanrobles\.com$'
    - '(.*\.)?elibrary\.judiciary\.gov\.ph$'
    - '(.*\.)?sc\.judiciary\.gov\.ph$'
    - '(.*\.)?officialgazette\.gov\.ph$'
    - '(.*\.)?gov(\.[a-z]{2})?$'

engines:
  # ALL rotation engines are enabled here so the front-door ROUTER can target
  # any subset per-query via the `engines=` API param. The router owns the
  # rotation policy (per-engine token buckets + index-family hot-spares), NOT
  # SearXNG's defaults.
  #
  # R1 (2026-10-13, anti-blocking investigation doc — searx.space cross-check
  # of 94 independent public SearXNG instances): google/startpage/duckduckgo/
  # qwant/yahoo/mojeek/brave scrapers are 77-96% broken GLOBALLY (not a local
  # IP block — no networking change on our end fixes a global failure
  # pattern). Disabled below and replaced by the six engines verified LIVE
  # against our own egress IP on 2026-10-13: bing, yandex, "google cse"
  # (enabled by upstream defaults, no entry needed here — see router.go),
  # mwmbl, yep, wiby. Brave is covered instead by our own `braveapi`-style
  # adapter in the Go router's provider/tier waterfall (R4), not SearXNG's
  # dead scraper.
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
    retry_on_http_error: [403, 429] # each retry uses a different proxy/source ip (outgoing.retries)

  - name: yandex
    engine: yandex
    shortcut: yx
    disabled: false
    # safesearch is NOT implemented by this engine — the `hostnames` plugin
    # above is what actually filters its output.

  - name: mwmbl
    engine: mwmbl
    shortcut: mwm
    disabled: false

  - name: yep
    engine: yep
    shortcut: yep
    disabled: false

  - name: wiby
    engine: wiby
    shortcut: wib
    disabled: false

  # --- globally broken (84-96% error across 94 public SearXNG instances,
  #     searx.space 2026-10-13). Kept as explicit entries (disabled) so a
  #     future re-measurement doesn't have to re-declare them from scratch. ---
  - name: google
    engine: google
    shortcut: g
    disabled: true
  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: true
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: true
  - name: yahoo
    engine: yahoo
    shortcut: yh
    disabled: true
  - name: brave
    engine: brave
    shortcut: br
    disabled: true
  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: true
  - name: mojeek
    engine: mojeek
    shortcut: mjk
    disabled: true

  # Encyclopedic/structured — NOT general web. Disabled for web search because
  # they inject low-yield/off-topic "trash" results (Wikidata entities, etc.).
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: true

  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: true

  - name: github
    engine: github
    shortcut: gh
    disabled: true

outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0
  retries: 2
  pool_connections: 100
  pool_maxsize: 20
  # R1: goodwill with the small, API-first indexes (mwmbl/yep/wiby). Docs:
  # "Contact info here may be useful to avoid an engine blocking you."
  useragent_suffix: "self-hosted; admin@betamaxgroup.tech"
