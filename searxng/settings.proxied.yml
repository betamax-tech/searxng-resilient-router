# This file is `git update-index --skip-worktree`'d (see bottom of file for why).
# P0 fix 2026-10-13: this file was found reduced to ONLY the managed proxy block
# below, missing everything above — use_default_settings/general/search/server/
# ui/engines. That is a SearXNG settings.yml with no defaults merged in, which
# crashes EVERY request with `KeyError: 'default_doi_resolver'`
# (searx/preferences.py). Restored from `git show HEAD` (pre-corruption).
# See:
# /home/cmark/projects/openwebui-plugins/docs/investigations/2026-10-12-searxng-junk-results.md

use_default_settings: true

general:
  instance_name: "BetaMax Search"
  debug: false

search:
  safe_search: 2                      # floor only helps safesearch-capable engines; hostnames plugin below is the real fix for engines (e.g. yandex) that don't implement safesearch at all
  autocomplete: "google"
  default_lang: "en"
  # Retry across engines within a single search before giving up — improves
  # resilience when an engine transiently 403s / CAPTCHAs.
  max_page: 0
  formats:
    - html
    - json
  # Fast engine recovery — see settings.yml for rationale.
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 300
    SearxEngineTooManyRequests: 300
    cf_SearxEngineCaptcha: 600
    cf_SearxEngineAccessDenied: 300
    recaptcha_SearxEngineCaptcha: 600

server:
  secret_key: "OVERRIDDEN_BY_SEARXNG_SECRET_ENV"
  limiter: false
  image_proxy: true
  port: 8080
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: dark

# Engine-agnostic junk filter, applied to every result after every engine
# returns (so it still works even when an engine doesn't implement safesearch,
# e.g. yandex — see root cause #1 in the investigation doc). `remove` entries
# are the actual junk observed hitting live legal/technical queries on
# 2026-10-12; `high_priority` boosts the PH legal primary sources named in the
# task so they sort above generic noise even on a relevance tie.
hostnames:
  remove:
    - '(.*\.)?pornhub\.com$'
    - '(.*\.)?xvideos\.com$'
    - '(.*\.)?xnxx\.com$'
    - '(.*\.)?xhamster\.com$'
    - '(.*\.)?redtube\.com$'
    - '(.*\.)?youporn\.com$'
    - '(.*\.)?onlyfans\.com$'
    - '(.*\.)?chaturbate\.com$'
    - '(.*\.)?stripchat\.com$'
    - '(.*\.)?[a-z0-9-]*porn[a-z0-9-]*\..*'
    - '(.*\.)?friv\.com$'
    - '(.*\.)?[a-z0-9-]*gamesforgirls[a-z0-9-]*\..*'
    - '(.*\.)?framesynthesis\.com$'      # observed junk hit (3D driving/parking simulators), 2026-10-12
    - '(.*\.)?ra\.co$'                   # observed junk hit (Resident Advisor music site) for query "RA 4726", 2026-10-12
  low_priority:
    - '(.*\.)?pinterest\.com$'
    - '(.*\.)?tiktok\.com$'
    - '(.*\.)?youtube\.com$'
    - '(.*\.)?dictionary\.com$'
    - '(.*\.)?wiktionary\.org$'
  high_priority:
    - '(.*\.)?lawphil\.net$'
    - '(.*\.)?chanrobles\.com$'
    - '(.*\.)?elibrary\.judiciary\.gov\.ph$'
    - '(.*\.)?sc\.judiciary\.gov\.ph$'
    - '(.*\.)?officialgazette\.gov\.ph$'
    - '(.*\.)?gov(\.[a-z]{2})?$'

engines:
  # All rotation engines enabled; router targets subsets via engines= per query.
  # See settings.yml for the index-family rationale.
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: yahoo
    engine: yahoo
    shortcut: yh
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: false

  - name: yandex
    engine: yandex
    shortcut: yx
    disabled: false

  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: false

  - name: mojeek
    engine: mojeek
    shortcut: mjk
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: true

  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: true

  - name: github
    engine: github
    shortcut: gh
    disabled: true


