# --- Why this file remains `skip-worktree` (decision, 2026-10-13) ---
# The managed proxy block above is regenerated by go/proxypool every ~30 min
# (systemd timer searxng-proxypool.timer), which would otherwise make this file
# "modified" in `git status` essentially permanently — that routine churn is
# exactly why skip-worktree was applied in the first place, and that reasoning
# still holds. What changed today is HOW corruption is prevented: previously,
# skip-worktree was the ONLY thing standing between a bad edit and total outage,
# and it actively hid the damage from `git status`/`git diff` (root cause #2).
# Now, go/proxypool.go's writeSettings() refuses (loud, exit 3, logged) to write
# back a file that has lost use_default_settings/engines — see settingsguard.go.
# That moves protection from "detect via git" (which failed) to "prevent at the
# only writer" (which can't be silently bypassed the way a stale git diff was).
# Keeping skip-worktree with that guard in place gets both: no 30-min diff noise,
# and no silent recurrence of this exact outage. If the guard is ever removed,
# skip-worktree MUST be removed too, or the next corruption will be invisible
# again. The restored core content above is committed to git (`git show HEAD`)
# as the recoverable baseline regardless of the worktree bit.
